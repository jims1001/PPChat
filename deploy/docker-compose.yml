version: '3.8'
services:
  mariadb:
    image: mariadb:10.11.9
    container_name: mariadb_webchat
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: qwe123
      MYSQL_DATABASE: webchat
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb3
      --collation-server=utf8mb3_general_ci
      --sql_mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION
      --innodb_file_per_table=1
      --innodb_default_row_format=DYNAMIC
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: redis-server --requirepass password
    ports:
      - "7001:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=webchat
      - RABBITMQ_DEFAULT_PASS=vtDM98R95c1q8IxT

  zookeeper:
    image: zookeeper:3.7
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - /etc/nats.conf:/etc/nats/nats.conf
      - nats_data:/data/jetstream
    command: [ "-c", "/etc/nats/nats.conf" ]

  postgresDB:
    image: postgres:16 # 使用 PostgreSQL 16 官方镜像，你也可以指定其他版本，例如 postgres:latest, postgres:14 等
    container_name: my_postgres_db # 给容器一个易于识别的名称
    environment:
      POSTGRES_USER: root # PostgreSQL 数据库的用户名
      POSTGRES_PASSWORD: pwd124 # PostgreSQL 数据库的密码
      POSTGRES_DB: sc_AgentChat # 默认创建的数据库名称
    ports:
      - "5432:5432" # 将主机端口 5432 映射到容器端口 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data # 持久化数据库数据
      # - ./init:/docker-entrypoint-initdb.d # 可选：用于初始化数据库的脚本目录
    restart: always # 容器停止后自动重启

  vault:
    image: hashicorp/vault:1.17.0
    container_name: vault
    ports:
      - "8200:8200" # 将宿主机的8200端口映射到容器的8200端口
    volumes:
      - /Users/tong/service/config:/vault/config:ro # 映射配置文件，只读模式
      - /Users/tong/service/config:/vault/file      # 映射数据目录，用于持久化数据
    cap_add:
      - IPC_LOCK # 允许Vault锁定内存，防止敏感数据被交换到磁盘
    environment:
      # VAULT_LOCAL_CONFIG 环境变量可以用于在容器内部直接提供Vault配置
      # 通常推荐使用挂载配置文件的方式，但这里作为备选或补充
      # VAULT_ADDR='http://0.0.0.0:8200' # 如果需要容器内部访问自身，可以设置
      # VAULT_API_ADDR='http://0.0.0.0:8200'
      # VAULT_CLUSTER_ADDR='http://0.0.0.0:8201' # 集群地址，HA模式下使用
      VAULT_LOG_LEVEL: "info" # 设置日志级别
    entrypoint: vault server -config=/vault/config/vault.json # <--- CORRECTED LINE
    restart: unless-stopped # 配置容器在非手动停止时自动重启

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - postgres_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "10005:9000"    # 把容器内 9000 映射到本机的 10005（与你配置文件匹配）
      - "9001:9001"     # 控制台 UI
    environment:
      MINIO_ROOT_USER: root            # 与 accessKeyID 一致
      MINIO_ROOT_PASSWORD: openIM123   # 与 secretAccessKey 一致
    volumes:
      - ./data:/data
    command: server :minio_data/data --console-address ":9001"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    depends_on:
      - kafka
    ports:
      - "10080:10080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local-kafka:
              properties:
                bootstrap.servers: "kafka:9092"
  
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: etcd
    ports:
      - "12379:2379"  # 对外服务端口，映射到宿主机12379
      - "12380:2380"  # 集群通信端口
    environment:
      - ETCD_NAME=etcd0
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://0.0.0.0:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_CLUSTER=etcd0=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster
    volumes:
      - etcd-data:/etcd-data

  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly
    container_name: dragonfly
    ports:
      - "6379:6379"
    command: >
      /dragonfly
      --logtostderr
      --maxmemory=1gb

  consul:
    image: hashicorp/consul:1.21.4
    container_name: consul
    command: >
      agent
      -server -bootstrap-expect=1
      -ui
      -client=0.0.0.0
      -bind=0.0.0.0
      -data-dir=/consul/data
      -config-dir=/consul/config
    ports:
      - "8500:8500"        # HTTP API + UI
      - "8600:8600/udp"    # DNS
    volumes:
      - ./consul-data:/consul/data
      - ./consul-config:/consul/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8500/v1/status/leader"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  mariadb-data:
  redis-data:
  nats_data:
  postgres_data:
  mongo_data:
  minio_data:
  etcd-data:
  consul-data:
  
